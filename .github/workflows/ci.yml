name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p backend/data

      - name: Run migrations and seeds
        run: npm run setup

      - name: App smoke test
        run: node -e "require('./backend/src/app'); console.log('APP_OK')"
