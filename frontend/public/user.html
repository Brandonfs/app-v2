<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Assist | Modulo Usuario</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-grid">
  <main class="shell">
    <header id="topbar" class="topbar view-card"></header>

    <section class="view-card">
      <h2>Perfil y estado</h2>
      <p id="user-info">Cargando...</p>
    </section>

    <section class="view-card">
      <h2>Mis asistencias</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha y hora</th>
            <th>Sucursal</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="my-attendance"></tbody>
      </table>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/user.js"></script>
</body>
</html>
