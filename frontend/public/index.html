<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia QR | Bienvenida</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-grid">
  <main class="shell shell-auth">
    <section class="hero-card">
      <div class="brand-lockup">
        <img src="/images/logo.png" alt="Logo Asistencia QR" class="brand-logo" />
        <h1>Asistencia QR</h1>
      </div>
      <p>Sistema profesional de asistencia por QR con control por roles.</p>
      <p class="section-help">Ingresa con tu cuenta para ver solo las funciones que corresponden a tu rol.</p>
      <ul>
        <li>Autenticacion JWT</li>
        <li>Registro y asistencia con camara</li>
        <li>Reportes exportables PDF/Excel</li>
      </ul>
    </section>

    <section class="panel-card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Iniciar sesion</button>
        <button class="tab-btn" data-tab="register">Registrarse</button>
      </div>

      <form id="login-form" class="tab-pane active">
        <label>Cedula
          <input type="text" name="cedula" required />
        </label>
        <label>Contraseña
          <input type="password" name="password" required />
        </label>
        <button type="submit">Entrar</button>
      </form>

      <form id="register-form" class="tab-pane">
        <label>Nombre completo
          <input type="text" name="fullName" required />
        </label>
        <label>Cedula
          <input type="text" name="cedula" required />
        </label>
        <label>Contraseña
          <input type="password" name="password" minlength="6" required />
        </label>
        <button type="submit">Crear cuenta</button>
      </form>

      <p id="auth-message" class="message"></p>
    </section>

  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
