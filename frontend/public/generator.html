<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Assist | Generador por Sede</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-grid">
  <main class="shell">
    <header id="topbar" class="topbar view-card"></header>

    <section class="view-card">
      <h2>QR en vivo por sede</h2>
      <p>Visible solo para el usuario generador. Cada QR cambia cada 3 segundos y registra su hora de generacion.</p>
      <div id="generator-qr-list" class="qr-wall-grid">
        <p>Cargando QR por sede...</p>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/generator.js"></script>
</body>
</html>
